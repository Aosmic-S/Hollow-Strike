services:
  - type: web
    name: hollow-strike-backend
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CUSTOM_MAP_URL
        value: https://raw.githubusercontent.com/Aosmic-S/Hollow-Strike/b8fdc2d84131569747a1fa9db1b516e1a4dd136b/public/models/Map/Warehouse.glb
